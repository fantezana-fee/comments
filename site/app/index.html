<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FEE Comment Assistant</title>
<link rel="stylesheet" href="https://use.typekit.net/sxi1zkj.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@500;700&display=swap">
<style>
:root { color-scheme: light; --navy:#214291; --paper:#F4F3ED; --slate:#C0DBE2; --orange:#F16631; --gold:#FBAF33; --white:#fff; }
* { box-sizing: border-box; }
body { margin:0; background:var(--paper); color:var(--navy); font:500 16px/1.5 'futura-pt','Lexend',sans-serif; }
h1,h2,h3 { font-family:'futura-pt','Lexend',sans-serif; font-weight:700; margin:0; }
h2 { font-size:20px; }
a { color:var(--navy); }
h3 { font-size:13px; text-transform:uppercase; letter-spacing:.1em; }
header { background:var(--white); border-bottom:1px solid var(--slate); padding:12px 16px; display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
header img { height:38px; }
header h1 { font-size:18px; text-transform:uppercase; letter-spacing:.06em; }
.demo { background:var(--gold); padding:1px 8px; border-radius:10px; font-size:11px; vertical-align:middle; }
header .who { margin-left:auto; display:flex; align-items:center; gap:8px; font-size:14px; }
input, textarea { font:inherit; color:var(--navy); border:1px solid var(--navy); background:var(--white); padding:8px 10px; border-radius:4px; width:100%; }
textarea { resize:vertical; }
label { display:block; font-size:12px; text-transform:uppercase; letter-spacing:.1em; margin:14px 0 4px; }
button { font:inherit; text-transform:uppercase; letter-spacing:.08em; font-size:13px; padding:9px 14px; border-radius:4px; border:1px solid var(--navy); background:var(--white); color:var(--navy); cursor:pointer; }
button:hover { background:var(--slate); }
button.primary { background:var(--orange); border-color:var(--orange); color:var(--white); }
button.primary:hover { background:#d9561f; }
button.link { border:0; background:none; padding:0; text-transform:none; letter-spacing:0; font-size:14px; text-decoration:underline; }
button.link:hover { background:none; }
button:disabled { opacity:.5; cursor:default; }
main { display:grid; grid-template-columns:380px minmax(0,1fr); gap:16px; padding:16px; max-width:1240px; margin:0 auto; align-items:start; }
.col { display:flex; flex-direction:column; gap:16px; min-width:0; }
.panel { background:var(--white); border:1px solid var(--slate); border-radius:6px; padding:16px; }
.seg { display:grid; grid-template-columns:1fr 1fr; gap:0; }
.seg button { border-radius:0; padding:11px 8px; text-transform:none; letter-spacing:0; font-size:15px; }
.seg button:first-child { border-radius:4px 0 0 4px; }
.seg button:last-child { border-radius:0 4px 4px 0; border-left:0; }
.seg button.on { background:var(--navy); color:var(--paper); }
.tabs { display:flex; gap:6px; margin:14px 0 12px; flex-wrap:wrap; }
.tabs button { padding:7px 11px; }
.tabs button.on { background:var(--navy); color:var(--paper); }
.item { padding:10px; border:1px solid var(--slate); border-radius:4px; margin-bottom:8px; cursor:pointer; background:var(--paper); }
.item:hover, .item.sel { border-color:var(--navy); }
.item .user { font-size:12px; text-transform:uppercase; letter-spacing:.08em; opacity:.8; }
.item .txt { overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
.muted { opacity:.7; }
.small { font-size:13px; }
.quote { border-left:4px solid var(--slate); padding:4px 12px; margin:4px 0 8px; font-family:'minion-pro','Times New Roman',serif; font-weight:700; font-style:italic; font-size:19px; }
.post { background:var(--paper); border-radius:4px; padding:10px 12px; display:flex; gap:12px; justify-content:space-between; align-items:center; flex-wrap:wrap; }
.row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:12px; }
.cta { border:1px solid var(--slate); border-radius:4px; padding:10px 12px; margin-top:10px; background:var(--paper); }
.cta .cap { overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; font-size:14px; }
.chip { display:inline-block; background:var(--navy); color:var(--paper); padding:1px 9px; border-radius:10px; font-size:12px; letter-spacing:.08em; text-transform:uppercase; }
.chip.none { background:var(--slate); color:var(--navy); }
.cta .foot { display:flex; justify-content:space-between; gap:8px; align-items:center; flex-wrap:wrap; margin-top:8px; }
details summary { cursor:pointer; font-size:14px; text-decoration:underline; }
.toast { position:fixed; left:50%; bottom:20px; transform:translateX(-50%); background:var(--navy); color:var(--paper); padding:10px 16px; border-radius:6px; max-width:90vw; z-index:5; }
@media (max-width:860px) { main { grid-template-columns:1fr; } header .who { margin-left:0; } }
</style>
</head>

  <h1>Comment Assistant <span class="demo">DEMO</span></h1>
  <div class="who"><span>Reviewer</span><input id="reviewer" style="width:140px" placeholder="Your name"></div>
</header>
<main>
  <div class="col">
    <section class="panel">
      <h3>Instagram account</h3>
      <div class="seg" id="seg" style="margin-top:8px"></div>
      <div class="tabs" id="tabs"></div>
      <div id="list"></div>
      <details style="margin-top:8px">
        <summary>Add a comment manually</summary>
        <label for="mcomment">Comment</label>
        <textarea id="mcomment" rows="3" placeholder="Paste a comment"></textarea>
        <label for="mcaption">Post caption</label>
        <textarea id="mcaption" rows="2" placeholder="Paste the caption"></textarea>
        <div class="row"><button id="madd">Draft reply</button></div>
      </details>
    </section>
    <section class="panel">
      <h2>CTA comments</h2>
      <p class="small muted" style="margin:4px 0 0">Last 5 posts. The keyword is read from each caption. Send the reply to everyone who commented it in one go.</p>
      <div id="ctas"></div>
    </section>
  </div>
  <section class="panel" id="detail"></section>
</main>
<div class="toast" id="toast" hidden></div>
<script>
// DEMO ONLY: sample data, nothing is sent to Instagram and no AI is called.
const igPost = (acct) => `https://www.instagram.com/${acct}/`; // placeholder; real build links to the exact post
const A = {
  feeonline: {
    posts: [
      { id:'p1', caption:'The price of everything is a signal. When someone else is paying, nobody shops on price. Comment LIBERTY and we will send you the full article.', kw:'LIBERTY', waiting:14, sent:0 },
      { id:'p2', caption:'Milton Friedman explained it better than anyone. Want our free guide to his ideas? Comment FREEDOM below.', kw:'FREEDOM', waiting:6, sent:0 },
      { id:'p3', caption:'Why do prices rise when supply drops? Comment PRICES and we will DM you the article.', kw:'PRICES', waiting:3, sent:0 },
      { id:'p4', caption:'Happy Thanksgiving from all of us at FEE. What are you grateful for this year?', kw:null, waiting:0, sent:0 },
      { id:'p5', caption:'Entrepreneurs solve problems nobody asked them to. Comment LIBERTY for the story behind this one.', kw:'LIBERTY', waiting:0, sent:21 },
    ],
    items: [
      { id:'o1', user:'@mara.vee', post:'p1', text:'Rot in hell for what this crook did in his part of the overthrowing of the Government in Chile 1973.',
        short:"This is a painful chapter, and we're not dismissing it. Friedman first visited Chile in 1975, two years after the coup, and said economic freedom wouldn't last without political freedom.",
        long:"This is a painful chapter, and we're not dismissing it. The coup was in 1973 and Friedman first visited Chile in 1975, so he had no part in it. He did give advice on inflation, and said publicly that economic freedom wouldn't last unless political freedom returned." },
      { id:'o2', user:'@econ_dan', post:'p1', text:'The fallacy here is assuming the demand will remain elastic.',
        short:"Fair point, elasticity varies. But savings from cheaper goods get spent elsewhere, which is how we went from mostly farming to a diverse economy.",
        long:"It's a fair point, and elasticity does vary by industry. But when something gets cheaper, the savings don't vanish, they get spent somewhere else. That's how farming went from most jobs to a tiny share and we still had work." },
      { id:'o3', user:'@jake.r', post:'p2', text:"Except the people on Caleb Hammer's Financial Audit!",
        short:"Ha, fair. But at least it's their own money, so they feel the consequences.",
        long:"Ha, fair. Even they have it better, though. It's their own money, so they feel the consequences and have a reason to change. When it's someone else's money, nobody does." },
    ],
  },
  feeenlinea: {
    posts: [
      { id:'q1', caption:'Los precios cuentan una historia. Comenta LIBERTAD y te enviamos el artículo completo.', kw:'LIBERTAD', waiting:9, sent:0 },
      { id:'q2', caption:'¿Quieres entender cómo funciona el mercado? Comenta MERCADO y te mandamos la guía gratis.', kw:'MERCADO', waiting:4, sent:0 },
      { id:'q3', caption:'El emprendimiento nace de resolver problemas reales. ¿Qué problema resolverías tú?', kw:null, waiting:0, sent:0 },
      { id:'q4', caption:'Comenta PROPIEDAD si quieres leer por qué es la base de la prosperidad.', kw:'PROPIEDAD', waiting:2, sent:0 },
      { id:'q5', caption:'Hayek en 60 segundos. Comenta LIBERTAD para recibir el artículo.', kw:'LIBERTAD', waiting:0, sent:12 },
    ],
    items: [
      { id:'e1', user:'@lucia_m', post:'q1', text:'Suena bien en teoría, pero ¿quién protege a los más pobres?',
        short:'Buena pregunta. Cuando hay competencia, los precios bajan y eso ayuda más a quienes menos tienen. ¿Qué parte te preocupa más?',
        long:'Es una preocupación legítima. Cuando hay competencia y libertad para emprender, los precios bajan y aparecen más opciones, y eso beneficia sobre todo a quienes menos tienen. ¿Qué parte te preocupa más?' },
      { id:'e2', user:'@tomas.ok', post:'q2', text:'Excelente explicación, gracias!',
        short:'Gracias por leernos. Nos alegra que te sirva.',
        long:'Muchas gracias por tu comentario. Nos alegra mucho que la explicación te haya servido, y te invitamos a seguir con nosotros.' },
      { id:'e3', user:'@carlosgp', post:'q1', text:'El libre mercado es el culpable de la desigualdad.',
        short:'Entiendo la preocupación. ¿Qué ejemplo tienes en mente? Así podemos mirarlo juntos.',
        long:'Entiendo la preocupación, y es un debate importante. Muchas veces la desigualdad tiene que ver con reglas que favorecen a unos pocos y no con la libre competencia. ¿Qué ejemplo tienes en mente? Así lo podemos mirar juntos.' },
    ],
  },
};
Object.values(A).forEach((a) => a.items.forEach((i) => { i.status = 'pending'; i.mode = 'short'; i.final = i.short; }));

const S = { acct: 'feeonline', tab: 'pending', sel: null, confirm: null };
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
const acct = () => A[S.acct];
const postOf = (i) => acct().posts.find((p) => p.id === i.post);
const clip = (s, n) => (s.length > n ? s.slice(0, n).trimEnd() + '...' : s);
let toastTimer;
function toast(msg) { const t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 3500); }
try { $('reviewer').value = localStorage.getItem('reviewer') || ''; } catch {}
$('reviewer').oninput = (e) => { try { localStorage.setItem('reviewer', e.target.value); } catch {} };

function firstPending() { return acct().items.find((i) => i.status === 'pending'); }

function render() {
  $('seg').innerHTML = Object.keys(A).map((k) => `<button data-a="${k}" class="${S.acct === k ? 'on' : ''}" aria-pressed="${S.acct === k}">@${k}</button>`).join('');
  $('seg').querySelectorAll('button').forEach((b) => b.onclick = () => { S.acct = b.dataset.a; S.tab = 'pending'; S.confirm = null; S.sel = firstPending()?.id || null; render(); });

  const items = acct().items;
  const count = (s) => items.filter((i) => i.status === s).length;
  const tabs = [['pending','Pending'], ['passed','Passed'], ['skipped','Skipped']];
  $('tabs').innerHTML = tabs.map(([k, l]) => `<button data-t="${k}" class="${S.tab === k ? 'on' : ''}">${l} (${count(k)})</button>`).join('');
  $('tabs').querySelectorAll('button').forEach((b) => b.onclick = () => { S.tab = b.dataset.t; render(); });

  const shown = items.filter((i) => i.status === S.tab);
  $('list').innerHTML = shown.length ? shown.map((i) => `
    <div class="item ${S.sel === i.id ? 'sel' : ''}" data-id="${i.id}">
      <div class="user">${esc(i.user)}</div><div class="txt">${esc(i.text)}</div></div>`).join('')
    : `<p class="muted small">${S.tab === 'pending' ? 'All caught up. New comments will appear here.' : 'Nothing here yet.'}</p>`;
  $('list').querySelectorAll('.item').forEach((el) => el.onclick = () => { S.sel = el.dataset.id; render(); });

  renderCtas();
  renderDetail();
}

function renderCtas() {
  $('ctas').innerHTML = acct().posts.map((p) => {
    const cap = `<div class="cap">${esc(p.caption)}</div>`;
    if (!p.kw) return `<div class="cta">${cap}<div class="foot"><span class="chip none">No CTA found</span></div></div>`;
    const asking = S.confirm === p.id;
    let action;
    if (p.waiting === 0) action = `<span class="small muted">All sent${p.sent ? ' (' + p.sent + ')' : ''}</span>`;
    else if (asking) action = `<span class="row" style="margin:0"><button class="primary" data-go="${p.id}">Confirm: send to ${p.waiting}</button><button data-no="1">Cancel</button></span>`;
    else action = `<button class="primary" data-send="${p.id}">Send to ${p.waiting}</button>`;
    return `<div class="cta">${cap}<div class="foot"><span><span class="chip">${esc(p.kw)}</span> <span class="small muted">${p.waiting} waiting</span></span>${action}</div></div>`;
  }).join('');
  $('ctas').querySelectorAll('[data-send]').forEach((b) => b.onclick = () => { S.confirm = b.dataset.send; renderCtas(); });
  $('ctas').querySelectorAll('[data-no]').forEach((b) => b.onclick = () => { S.confirm = null; renderCtas(); });
  $('ctas').querySelectorAll('[data-go]').forEach((b) => b.onclick = () => {
    const p = acct().posts.find((x) => x.id === b.dataset.go);
    toast(`Demo: replied to ${p.waiting} people who commented ${p.kw}. Nothing was really sent.`);
    p.sent += p.waiting; p.waiting = 0; S.confirm = null; renderCtas();
  });
}

function renderDetail() {
  const i = acct().items.find((x) => x.id === S.sel);
  if (!i) { $('detail').innerHTML = '<h2>Review</h2><p class="muted">Pick a comment from the list.</p>'; return; }
  const p = postOf(i);
  const long = i.mode === 'long';
  $('detail').innerHTML = `
    <h2>Review</h2>
    <label>Comment from ${esc(i.user)}</label>
    <div class="quote">${esc(i.text)}</div>
    <label>Post</label>
    <div class="post"><span class="small">${esc(clip(p.caption, 90))}</span><a class="small" href="${igPost(S.acct)}" target="_blank" rel="noopener">View post</a></div>
    <label for="final">Reply${long ? ' (longer version)' : ''}</label>
    <textarea id="final" rows="${long ? 6 : 4}" ${i.status !== 'pending' ? 'disabled' : ''}>${esc(i.final)}</textarea>
    ${i.status === 'pending' ? `<div class="row" style="margin-top:6px"><button class="link" id="mode">${long ? 'Use the shorter version' : 'Use a longer version'}</button></div>
    <label for="note">Not quite right? Tell Claude what to change</label>
    <div class="row" style="margin-top:0"><input id="note" placeholder="e.g. warmer, less formal" style="flex:1;min-width:180px"><button id="regen">Redraft</button></div>
    <div class="row" style="margin-top:20px"><button class="primary" id="ok">Approve and post</button><button id="skip">Skip</button></div>
    <p class="small muted">When Instagram is connected, this posts the reply as @${esc(S.acct)} right away.</p>` : `<p class="muted small">${i.status === 'passed' ? 'Posted' : 'Skipped'}.</p>`}`;
  if (i.status !== 'pending') return;
  $('final').oninput = (e) => { i.final = e.target.value; };
  $('mode').onclick = () => { i.mode = long ? 'short' : 'long'; i.final = i[i.mode]; renderDetail(); };
  $('regen').onclick = () => toast($('note').value ? `Demo: Claude would redraft with "${$('note').value}".` : 'Demo: type an instruction first.');
  const next = () => { S.sel = firstPending()?.id || null; render(); };
  $('ok').onclick = () => { i.status = 'passed'; toast(`Demo: posted as @${S.acct}. Nothing was really sent.`); next(); };
  $('skip').onclick = () => { i.status = 'skipped'; next(); };
}

$('madd').onclick = () => {
  const text = $('mcomment').value.trim(); if (!text) return;
  const pid = 'm' + Date.now();
  acct().posts.unshift({ id:pid, caption:$('mcaption').value || '(no caption)', kw:null, waiting:0, sent:0 });
  const short = '[Demo: a real Claude draft in FEE\'s voice appears here.]';
  const it = { id:'i' + Date.now(), user:'manual', post:pid, text, short, long:short, status:'pending', mode:'short', final:short };
  acct().items.unshift(it); $('mcomment').value = ''; $('mcaption').value = ''; S.tab = 'pending'; S.sel = it.id; render();
};

S.sel = firstPending().id;
render();
</script>
</body>
</html>
